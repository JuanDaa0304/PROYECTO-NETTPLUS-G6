{# Íconos de línea (SVG) usados en el menú y los botones #}
{% macro icono(nombre) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if nombre == 'inicio' -%}<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>
{%- elif nombre == 'carga' -%}<path d="M12 15V4"/><path d="m7.5 8.5 4.5-4.5 4.5 4.5"/><path d="M4 15v4.5h16V15"/>
{%- elif nombre == 'registro' -%}<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
{%- elif nombre == 'personal' -%}<circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9.5" r="2.5"/><path d="M17.5 14.5c2 .3 3.4 1.8 4 4.5"/>
{%- elif nombre == 'marcaciones' -%}<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
{%- elif nombre == 'parte' -%}<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>
{%- elif nombre == 'indicadores' -%}<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
{%- elif nombre == 'cierre' -%}<path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4"/><path d="M9.5 13h6M9.5 16.5h6"/>
{%- elif nombre == 'cuentas' -%}<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.5-6s6.5 2 7.5 6"/>
{%- elif nombre == 'trazabilidad' -%}<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="12" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8.5 6.5 15.5 11M8.5 17.5l7-4.5"/>
{%- elif nombre == 'salir' -%}<path d="M14 4h5v16h-5"/><path d="M10 16l4-4-4-4M14 12H4"/>
{%- elif nombre == 'menu' -%}<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif nombre == 'excel' -%}<path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4"/><path d="m9.5 11 4 5M13.5 11l-4 5"/>
{%- elif nombre == 'buscar' -%}<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
{%- endif -%}
</svg>
{%- endmacro %}
